  <script>
    function init() {
      const data = {
        mokuji: true,
        title: "NDPCの個人的な解説",
        date: [2026, 5, 5],
        content: [
          ``, ``,
          `# 0. この解説について`,
          `---`,
          `NDPCについては[こちら](https://atcoder.jp/contests/ndpc)を参照してください。`,
          `この解説は、私、かみゅ～(AtCoder ID: googology)がコンテスト中に考えたことをたどっているので、正確性ではなく、発想の観点から見てもらえると幸いです。`,
          `「」←これで囲まれているところは大体コンテスト中の私の思考を表しています。`,
          `（稀に数式が変換されない時があります。その場合はリロードしてください。）`,
          ``, ``, ``, ``,
          `1. A - ポリオミノ`,
          `---`,
          `# [問題](https://atcoder.jp/contests/ndpc/tasks/ndpc2026_a)`,
          `「DPをしろと言われているのでDPしますか」`,
          `「状態の数は、、、多いなぁ」`,
          `「頑張って圧縮できないかなぁ」`,
          `「ん？待てよ、これ形的に、『端がそろっている』か『端が一マスだけ出っ張っている』しかないな。」`,
          `「あと後者は出っ張ってるのが上でも下でも対称性から同じと考えてよさそうだな。」`,
          `「一旦書いてみるか。」`,
          `> $dp1[i]$ = $i$列すべて埋まっている場合`,
          `> $dp2[i]$ = $i-1$列まですべて埋まっていて、$i$列目が片方だけ出っ張っている場合`,
          `---`,
          `とりあえず、分かりやすいように$dp1$を状態1、$dp2$を状態2と呼ぶことにします。`,
          `-# これからは、次の様に表す。'#'：既に埋まっているマス、'@'：新しく置いたタイル、'.'：空いているマス`,
          `-# 記法は[loopさんの記事](https://zenn.dev/loop0919/articles/7f3c348541b3b4)を参考にしました。`,
          `\`\`\``,
          `状態1`,
          `##...`,
          `##...`,
          ``,
          `状態2`,
          `###..      ##...`,
          `##...  or  ###..`,
          `\`\`\``,
          `ここで、状態2は二つあり、これらを同じと見なしていますが、タイルの置き方としては違うことに注意してください。`,
          `まず、状態1に長方形型のタイルを置く方法は、`,
          `\`\`\``,
          `##...      ##@..`,
          `##...  ->  ##@..`,
          ``,
          `##...      ##@@.      ####.`,
          `##...  ->  ##...  ->  ##@@.`,
          `\`\`\``,
          `の二通りのみです。（二つ目の置き方は、凹みがニマス以上になるとL字型のタイルが配置できなくなるのでこれしかありません。）`,
          `これらの遷移をプログラムの様に表してみましょう。`,
          `\`\`\``,
          `dp1[i+1] += dp1[i]`,
          `dp1[i+2] += dp1[i]`,
          `\`\`\``,
          `こうですね。`,
          `次に、状態1にL字型のタイルを置く方法は、`,
          `\`\`\``,
          `##...      ##@..`,
          `##...  ->  ##@@.`,
          ``,
          `##...      ##@@.`,
          `##...  ->  ##@..`,
          `\`\`\``,
          `の二通りですね。`,
          `ここで、どちらも状態2であることから次の様に書けます。`,
          `\`\`\``,
          `dp2[i+2] += dp1[i] * 2`,
          `\`\`\``,
          `同様に、状態2に長方形型のタイルを置く方法は、`,
          `\`\`\``,
          `###..      ###..`,
          `##...  ->  ##@@.`,
          `\`\`\``,
          `これしかないですね。`,
          `これは状態2なので、`,
          `\`\`\``,
          `dp2[i+1] += dp2[i]`,
          `\`\`\``,
          `最後に、状態2にL字型のタイルを置く方法は、`,
          `\`\`\``,
          `###..      ###@.`,
          `##...  ->  ##@@.`,
          `\`\`\``,
          `これだけなので、`,
          `\`\`\``,
          `dp1[i+1] += dp2[i]`,
          `\`\`\``,
          `です。まとめると、`,
          `\`\`\``,
          `dp1[i+1] += dp1[i]`,
          `dp1[i+2] += dp1[i]`,
          `dp2[i+2] += dp1[i] * 2`,
          `dp2[i+1] += dp2[i]`,
          `dp1[i+1] += dp2[i]`,
          `\`\`\``,
          `これが「配るdp」としての遷移の形です。`,
          `後は範囲外参照に気を付けて実装するだけです。`,
          `---`,
          `計算量：$O(N)$`,
          `[コンテスト中の提出](https://atcoder.jp/contests/ndpc/submissions/75520043)`,
          `C++のコード：`,
          `\`\`\``,
          `#include <bits/stdc++.h>`,
          ``,
          `int main() {`,
          `  int N;`,
          `  std::cin >> N;`,
          `  std::vector<long long> dp1(N + 2), dp2(N + 2);`,
          ``,
          `  dp1[0] = 1;`,
          `  for (int i = 0; i < N; i++) {`,
          `    dp1[i+1] += dp1[i];`,
          `    dp1[i+2] += dp1[i];`,
          `    dp2[i+2] += dp1[i] * 2;`,
          `    dp2[i+1] += dp2[i];`,
          `    dp1[i+1] += dp2[i];`,
          `  }`,
          `  std::cout << dp1[N] << std::endl;`,
          `}`,
          `\`\`\``,
          `**[追記]**`,
          `$dp[0]$、つまり「$0$列目までをすべて埋める」方法は**何もしない**の一通りです。`,
          `求めるべき値は、「$N$列目までをすべて埋める」組み合わせの数なので、$dp1[N]$を出力すればよい。`,
          ``, ``, ``, ``,
          `1. B - DAG`,
          `---`,
          `# [問題](https://atcoder.jp/contests/ndpc/tasks/ndpc2026_b)`,
          `「やっぱりdpと言ったらDAGだよね。」`,
          `「まあ一番最初に思いつくのはトポロジカルソートしてその順にdpだけど、、、」`,
          `「今回はメモ化再帰で行けそうかなぁ」`,
          `---`,
          `DAG→メモ化再帰の考え方を少し話します。飛ばしたい人は **↑** と同じ横線まで飛ばしてください。`,
          `まず、今回の問題の通り、頂点$N$に向かうのは同じとして、以下の問題を考えます。`,
          `> $f(i)$を、「頂点$i$から頂点$N$へのパスの数」とする。`,
          `> この時、$f(i)$を求めたい。`,
          `例えば、下の様なDAGを考えるとします。([参考](https://hello-world-494ec.firebaseapp.com/))`,
          `\\img(60) NDPC_B_DAG1.png`,
          `頂点データ`,
          `\`\`\``,
          `5 8`,
          `1 2`,
          `1 3`,
          `2 3`,
          `2 4`,
          `3 4`,
          `3 4`,
          `3 5`,
          `4 5`,
          `\`\`\``,
          `さて、このDAGに対して、$f(i)$を求めましょう。(ここで、$N=5$)`,
          `まず、頂点$5$から頂点$5$への行き方は、やはり**何もしない**の一通りなので、$f(5)=1$です。`,
          `次に、頂点$4$から頂点$5$への行き方は、頂点$4$から伸びている辺が頂点$5$に向かって一本なので、$f(4)=1$です。`,
          `頂点$3$から頂点$5$への行き方は、$3\\to5$が1つと$3\\to4\\to5$が2つなので合わせて$f(3)=3$なのですが、このままだと全部調べることになります。ですが、次の事実を使うと簡単になります：`,
          `> $f(i)$はいつ計算するかに依らず一定である。`,
          `これは、一見当たり前のように思えますが、これを用いることで次のことが分かります。`,
          `> $f$の値を求めたい頂点$s$について、行先の$f$の値の総和が$f(s)$に等しい。`,
          `これが本当かどうかは少し考えたらわかると思います。`,
          `直感的に説明すると、`,
          `> 頂点$s$から**次に**頂点$t$を経由する頂点$N$への行き方は、$f(t)$と同じである。`,
          `なので、$f(i)$の値を**メモ**すれば次にその値を使いたくなったときに使いまわせるので計算が速くなる、というわけです。`,
          `具体的には、$i$について一回だけ計算を行うので計算は$N$回になります。(実際の計算量は辺を一回ずつ探索しているのと同じなので$O(M)$になります。)`,
          `これを、**メモ化再帰**と言います。`,
          `---`,
          `お待たせしました。`,
          `といってもメモ化再帰を実装するだけですね。`,
          `マルチケースの問題でグローバル変数を使う時は扱いに注意してください。`,
          `以下のコードでは、ACLのmodintを使用しています。`,
          `---`,
          `計算量：$O(N+M)$`,
          `[コンテスト中の提出](https://atcoder.jp/contests/ndpc/submissions/75520670)`,
          `C++のコード：`,
          `\`\`\``,
          `#include <bits/stdc++.h>`,
          `#include <atcoder/modint>`,
          `using mint = atcoder::modint998244353;`,
          ``,
          `int N, M;`,
          `std::vector<std::vector<int>> edges;`,
          `std::vector<mint> memo;`,
          `std::vector<bool> visited;`,
          ``,
          `mint dfs(int now)`,
          `{`,
          `  if (now == N - 1)`,
          `    return memo[now] = 1;`,
          `  visited[now] = true;`,
          `  mint res(0);`,
          `  for (int to : edges[now])`,
          `  {`,
          `    if (visited[to])`,
          `      res += memo[to];`,
          `    else`,
          `      res += dfs(to);`,
          `  }`,
          ``,
          `  return memo[now] = res;`,
          `}`,
          ``,
          `void solve() {`,
          `  std::cin >> N >> M;`,
          ``,
          `  edges = std::vector<std::vector<int>>(N);`,
          `  for (int i = 0; i < M; i++) {`,
          `    int u, v;`,
          `    std::cin >> u >> v;`,
          `    edges[u - 1].push_back(v - 1);`,
          `  }`,
          ``,
          `  memo = std::vector<mint>(N, 0);`,
          `  visited = std::vector<bool>(N, false);`,
          ``,
          `  std::cout << dfs(0).val() << std::endl;`,
          `}`,
          ``,
          `int main()`,
          `{`,
          `  int T;`,
          `  std::cin >> T;`,
          `  while (T--) solve();`,
          `}`,
          `\`\`\``,
          ``, ``, ``, ``,
          `1. C - 文字列`,
          `---`,
          ``,
          ``, ``, ``, ``,
          `1. 編集履歴`,

          `2026/05/07> A終わった`,
          `2026/05/07> Aちょっと修正`,
          `2026/05/08> B終わった`,
          ``, ``, ``, ``, ``,
        ],
      };

    }
