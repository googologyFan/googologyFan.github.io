  <script>
    function init() {
      const data = {
        mokuji: true,
        title: "NDPCの個人的な解説",
        date: [2026, 5, 5],
        content: [
          ``, ``,
          `# 0. この解説について`,
          `---`,
          `NDPCについては[こちら](https://atcoder.jp/contests/ndpc)を参照してください。`,
          `この解説は、私、かみゅ～(AtCoder ID: googology)がコンテスト中に考えたことをたどっているので、正確性ではなく、発想の観点から見てもらえると幸いです。`,
          `「」←これで囲まれているところは大体コンテスト中の私の思考を表しています。`,
          `（稀に数式が変換されない時があります。その場合はリロードしてください。）`,
          ``, ``,
          `1. A - ポリオミノ`,
          `---`,
          `「DPをしろと言われているのでDPしますか」`,
          `「状態の数は、、、多いなぁ」`,
          `「頑張って圧縮できないかなぁ」`,
          `「ん？待てよ、これ形的に、『端がそろっている』か『端が一マスだけ出っ張っている』しかないな。」`,
          `「あと後者は出っ張ってるのが上でも下でも対称性から同じと考えてよさそうだな。」`,
          `「一旦書いてみるか。」`,
          `> $dp1[i]$ = $i$列すべて埋まっている場合`,
          `> $dp2[i]$ = $i-1$列まですべて埋まっていて、$i$列目が片方だけ出っ張っている場合`,
          `とりあえず、分かりやすいように$dp1$を状態1、$dp2$を状態2と呼ぶことにします。`,
          `-# これからは、次の様に表す。'#'：既に埋まっているマス、'@'：新しく置いたタイル、'.'：空いているマス`,
          `-# 記法は[loopさんの記事](https://zenn.dev/loop0919/articles/7f3c348541b3b4)を参考にしました。`,
          `\`\`\``,
          `状態1`,
          `##...`,
          `##...`,
          ``,
          `状態2`,
          `###..      ##...`,
          `##...  or  ###..`,
          `\`\`\``,
          `ここで、状態2は二つあり、これらを同じと見なしていますが、タイルの置き方としては違うことに注意してください。`,
          `まず、状態1に長方形型のタイルを置く方法は、`,
          `\`\`\``,
          `##...      ##@..`,
          `##...  ->  ##@..`,
          ``,
          `##...      ##@@.      ####.`,
          `##...  ->  ##...  ->  ##@@.`,
          `\`\`\``,
          `の二通りのみです。（二つ目の置き方は、凹みがニマス以上になるとL字型のタイルが配置できなくなるのでこれしかありません。）`,
          `これらの遷移をプログラムの様に表してみましょう。`,
          `\`\`\``,
          `dp1[i+1] += dp1[i]`,
          `dp1[i+2] += dp1[i]`,
          `\`\`\``,
          `こうですね。`,
          `次に、状態1にL字型のタイルを置く方法は、`,
          `\`\`\``,
          `##...      ##@..`,
          `##...  ->  ##@@.`,
          ``,
          `##...      ##@@.`,
          `##...  ->  ##@..`,
          `\`\`\``,
          `の二通りですね。`,
          `ここで、どちらも状態2であることから次の様に書けます。`,
          `\`\`\``,
          `dp2[i+2] += dp1[i] * 2`,
          `\`\`\``,
          `同様に、状態2に長方形型のタイルを置く方法は、`,
          `\`\`\``,
          `###..      ###..`,
          `##...  ->  ##@@.`,
          `\`\`\``,
          `これしかないですね。`,
          `これは状態2なので、`,
          `\`\`\``,
          `dp2[i+1] += dp2[i]`,
          `\`\`\``,
          `最後に、状態2にL字型のタイルを置く方法は、`,
          `\`\`\``,
          `###..      ###@.`,
          `##...  ->  ##@@.`,
          `\`\`\``,
          `これだけなので、`,
          `\`\`\``,
          `dp1[i+1] += dp2[i]`,
          `\`\`\``,
          `です。まとめると、`,
          `\`\`\``,
          `dp1[i+1] += dp1[i]`,
          `dp1[i+2] += dp1[i]`,
          `dp2[i+2] += dp1[i] * 2`,
          `dp2[i+1] += dp2[i]`,
          `dp1[i+1] += dp2[i]`,
          `\`\`\``,
          `これが「配るdp」としての遷移の形です。`,
          `後は範囲外参照に気を付けて実装するだけです。`,
          ``,
          `[コンテスト中の提出](https://atcoder.jp/contests/ndpc/submissions/75520043)`,
          `C++のコード：`,
          `\`\`\``,
          `#include <bits/stdc++.h>`,
          ``,
          `int main() {`,
          `  int N;`,
          `  std::cin >> N;`,
          `  std::vector<long long> dp1(N + 2), dp2(N + 2);`,
          `  dp1[0] = 1;`,
          `  for (int i = 0; i < N; i++) {`,
          `    dp1[i+1] += dp1[i];`,
          `    dp1[i+2] += dp1[i];`,
          `    dp2[i+2] += dp1[i] * 2;`,
          `    dp2[i+1] += dp2[i];`,
          `    dp1[i+1] += dp2[i];`,
          `  }`,
          `  std::cout << dp1[N] << std::endl;`,
          `}`,
          `\`\`\``,
          ``, ``,
          `1. B - DAG`,
          `---`,
          ``,
          ``, ``,
          `1. 編集履歴`,
          `---`,
          `2026/05/07> A終わった`,
          ``, ``, ``, ``, ``,
        ],
      };

      addHeader();
      applyStyle1("main");
      setup("main", data);
    }
